dev:
    stage: deploy
    tags:
        - personal-api-development
    environment: development
    only:
        - development
    script:
        - docker build -t personal-api-development:deployment .
        - docker container rm personal-api-development -f
        - docker image rm personal-api-development:latest -f
        - docker tag personal-api-development:deployment personal-api-development:latest
        - docker rmi personal-api-development:deployment
        - docker-compose up -d
